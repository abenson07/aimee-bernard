<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aimee Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Instrument+Serif&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --light: #f9f5eb;
    --dark: #16231b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--dark);
    font-family: "Inter", sans-serif;
    color: var(--light);
  }
  .hero {
    position: relative;
    isolation: isolate;
    height: 100svh;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }
  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: #231f20;
    opacity: 0.4;
    z-index: -1;
  }
  .main-container {
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    padding: 97px 32px 80px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-title {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
  .logo {
    display: block;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.85;
    white-space: nowrap;
    transform-origin: left center;
  }
  .top-title-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }
  .label {
    font-family: "DM Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .headline-wrap {
    display: flex;
    flex-direction: column;
    gap: 32px;
    max-width: 640px;
  }
  .heading {
    display: flex;
    flex-wrap: wrap;
    gap: 0 8px;
  }
  .hide {
    overflow: hidden;
    margin-bottom: -15px;
    padding-bottom: 15px;
  }
  .text-h2 {
    font-family: "Instrument Serif", serif;
    font-size: 56px;
    letter-spacing: -0.02em;
    line-height: 100%;
    margin: 0;
    transform: translate3d(0, 200%, 0);
    opacity: 0;
    animation: word-in 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
  }
  @keyframes word-in {
    to { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  .button-wrap {
    display: flex;
    gap: 12px;
    opacity: 0;
    animation: fade-up 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    animation-delay: 1.1s;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .cta-main {
    border-radius: 8px;
    background: var(--dark);
    color: var(--light);
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    padding: 8px 16px;
    text-decoration: none;
    display: flex;
    overflow: hidden;
  }
  .cta-main.light { background: var(--light); color: var(--dark); }
  .cta-main.blured {
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--light);
  }
  .button-mask {
    height: 24px;
    overflow: hidden;
  }
  .button-stack {
    display: flex;
    flex-direction: column;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .cta-main:hover .button-stack {
    transform: translateY(-24px);
  }
  .button-stack div {
    height: 24px;
    display: flex;
    align-items: center;
  }
  .bottom-tile {
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 2;
  }
  .small-video {
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 300px;
    padding: 8px;
    overflow: hidden;
  }
  .lightbox-trigger {
    border-radius: 4px;
    background-image: url("https://byqsupply-components.netlify.app/FRANCO/images/SmallVideo.avif");
    background-position: center;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 160px;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .play-button {
    border-radius: 100vw;
    width: 40px;
    height: 40px;
    transition: transform 0.4s cubic-bezier(0.45, 0, 0.55, 1);
  }
  .lightbox-trigger:hover .play-button {
    transform: scale(1.1);
  }
  dialog {
    border: none;
    background: transparent;
    padding: 0;
    max-width: 90vw;
    max-height: 90vh;
  }
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.85);
  }
  dialog video {
    max-width: 90vw;
    max-height: 90vh;
    display: block;
    border-radius: 8px;
  }

  @media (max-width: 767px) {
    .main-container { padding: 64px 20px 40px; }
    .text-h2 { font-size: 40px; }
    .small-video { width: 90%; max-width: 220px; position: absolute; right: 0; }
    .bottom-tile { right: 16px; bottom: 16px; }
    .lightbox-trigger { height: 100px; }
    .play-button { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
  <section class="hero">
    <video autoplay loop muted playsinline poster="https://cdn.prod.website-files.com/6751dc3d88655c482ba588b8%2F67595b7416681c5c7dd18a5f_-2599-411c-b59e-c5c327dae87e-poster-00001.jpg">
      <source src="https://byqsupply-components.netlify.app/FRANCO/videos/-2599-411c-b59e-c5c327dae87e-transcode.mp4" type="video/mp4">
      <source src="https://byqsupply-components.netlify.app/FRANCO/videos/-2599-411c-b59e-c5c327dae87e-transcode.webm" type="video/webm">
    </video>
    <div class="hero-overlay"></div>

    <div class="main-container">
      <div class="top-title">
        <div class="logo" id="wordmark">AIMEE PUGH-BERNARD</div>
        <div class="top-title-row">
          <div class="label">Immunology, Made Human</div>
          <div class="label">By Aimee</div>
        </div>
      </div>

      <div class="headline-wrap">
        <div class="heading" id="heading">
          <div class="hide"><div class="text-h2" style="animation-delay:0.05s">Aimee</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.15s">turning</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.25s">immunology</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.35s">into</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.45s">stories</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.55s">everyone</div></div>
          <div class="hide"><div class="text-h2" style="animation-delay:0.65s">gets.</div></div>
        </div>
        <div class="button-wrap">
          <a href="#" class="cta-main light">
            <div class="button-mask">
              <div class="button-stack">
                <div>See Her Talks</div>
                <div>See Her Talks</div>
              </div>
            </div>
          </a>
          <a href="#" class="cta-main blured">
            <div class="button-mask">
              <div class="button-stack">
                <div>Meet Aimee</div>
                <div>Meet Aimee</div>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="bottom-tile">
      <div class="small-video">
        <button class="lightbox-trigger" id="openLightbox" aria-label="Watch video">
          <img src="https://byqsupply-components.netlify.app/FRANCO/images/SmallPlayButton.svg" alt="" class="play-button">
        </button>
        <div class="label">Watch Video</div>
      </div>
    </div>
  </section>

  <dialog id="videoDialog">
    <video id="dialogVideo" controls playsinline
      src="https://byqsupply-components.netlify.app/FRANCO/videos/-2599-411c-b59e-c5c327dae87e-transcode.mp4"></video>
  </dialog>

  <script>
    const dialog = document.getElementById('videoDialog');
    const dialogVideo = document.getElementById('dialogVideo');
    document.getElementById('openLightbox').addEventListener('click', () => {
      dialog.showModal();
      dialogVideo.play();
    });
    dialog.addEventListener('click', (e) => {
      if (e.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', () => dialogVideo.pause());

    // Stretch the wordmark to exactly fill the container width, the way the
    // original template's hand-cut SVG logo did — robust to any font metrics.
    const wordmark = document.getElementById('wordmark');
    function fitWordmark() {
      wordmark.style.transform = 'none';
      wordmark.style.fontSize = '10vw';
      const containerWidth = wordmark.parentElement.getBoundingClientRect().width;
      const textWidth = wordmark.getBoundingClientRect().width;
      wordmark.style.transform = `scaleX(${containerWidth / textWidth})`;
    }
    window.addEventListener('load', fitWordmark);
    window.addEventListener('resize', fitWordmark);
  </script>
</body>
</html>
