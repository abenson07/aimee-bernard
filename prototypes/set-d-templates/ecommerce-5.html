<!DOCTYPE html>
<html lang="en">
<head>

<title>ecommerce-5 (Stringer) — reference</title>
<style>
.section.stringer-panels { color: #121212; padding-top: 120px; padding-bottom: 120px; position: relative }
.media-img { object-fit: cover; object-position: center; width: 100%; height: 100%; transition: transform .5s; position: absolute; top: 0; left: 0 }
.media-img.layer { opacity: 0; transition: opacity .5s }
.media-img.layer.is-active { opacity: 1 }
.text-label { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; font-weight: 500; line-height: 1.2 }
.main-container { width: 100%; max-width: 1800px; margin: 0 auto; padding: 0 32px; position: relative }
.text-display-sm { letter-spacing: -.03em; margin: 0; font-size: 72px; font-weight: 500; line-height: 1 }
.text-h-sm { letter-spacing: -.02em; margin: 0; font-size: 24px; font-weight: 500; line-height: 1.1 }
.stack-tight { grid-row-gap: 12px; flex-direction: column; align-items: flex-start; display: flex }
.shop-head { grid-column-gap: 32px; border-bottom: 1px solid #1212121f; flex-direction: row; justify-content: space-between; align-items: flex-end; padding-bottom: 32px; display: flex }
.text-body-sm { letter-spacing: -.005em; margin: 0; font-size: 14px; font-weight: 400; line-height: 1.45; color: #121212a3 }
.panels { grid-column-gap: 16px; flex-direction: row; padding-top: 32px; display: flex }
.panel { grid-row-gap: 16px; color: #121212; flex-direction: column; flex: 1 1 0; min-width: 0; text-decoration: none; display: flex }
.panel-media { background-color: #e2ddd4; width: 100%; height: 620px; position: relative; overflow: hidden }
